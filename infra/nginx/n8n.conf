# n8n.klyro.codes → n8n main on :5678, protected by an IP allowlist + basic auth.
# n8n has its own login too; this is defence in depth. Add your IPs below.
server {
    listen 80;
    server_name n8n.klyro.codes;

    # allow <your-office-ip>;
    # allow <your-home-ip>;
    # deny all;

    auth_basic "Klyro n8n";
    auth_basic_user_file /etc/nginx/.htpasswd-n8n;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
