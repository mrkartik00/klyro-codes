# Klyro API + frontends. TLS is terminated by the VPS provider's front proxy,
# so nginx listens on :80 only (see infra/SERVER.md).

# api.klyro.codes → Express on :4100
server {
    listen 80;
    server_name api.klyro.codes;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (Socket.IO) upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# Static SPA server helper.
map $uri $klyro_app_root { default ""; }

# klyro.codes → web/ (public site). Express serves it for per-route meta on
# /pitch and blog; here we serve the built SPA directly for other routes.
server {
    listen 80;
    server_name klyro.codes www.klyro.codes;
    root /var/www/klyro/web;
    index index.html;

    # Pitch + blog routes are proxied to Express for server-side meta injection.
    location ~ ^/(pitch|blog)/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# app.klyro.codes → portal/
server {
    listen 80;
    server_name app.klyro.codes;
    root /var/www/klyro/portal;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}

# admin.klyro.codes → admin/
server {
    listen 80;
    server_name admin.klyro.codes;
    root /var/www/klyro/admin;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
