# Klyro — Nginx (behind the provider's Caddy SSL proxy; nginx routes on :80).
#   klyro.codes / www       → web/ SPA (public site + pitch pages via API)
#   app.klyro.codes         → portal/ SPA
#   admin.klyro.codes       → admin/ SPA
#   api.klyro.codes         → Express API on 127.0.0.1:4100 (+ Socket.IO)

limit_req_zone $binary_remote_addr zone=klyro_api:10m rate=20r/s;

# ── API: api.klyro.codes ────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.klyro.codes;
    client_max_body_size 5m;

    location / {
        limit_req zone=klyro_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# ── Public site: klyro.codes ────────────────────────────────────────────────
server {
    listen 80;
    server_name klyro.codes www.klyro.codes;
    root /var/www/klyro/web/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /previews/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Client portal: app.klyro.codes ──────────────────────────────────────────
server {
    listen 80;
    server_name app.klyro.codes;
    root /var/www/klyro/portal/dist;
    index index.html;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}

# ── Admin: admin.klyro.codes ────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.klyro.codes;
    root /var/www/klyro/admin/dist;
    index index.html;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
