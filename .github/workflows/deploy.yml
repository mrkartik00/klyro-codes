name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'design-system/**'
      - 'n8n/**'

# Deploys to the VPS over SSH: pull, install, build frontends, reload the API.
# Requires repo secrets: SSH_HOST, SSH_PORT, SSH_USER, SSH_KEY (klyro_deploy private key).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Pull, build & reload on VPS
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /var/www/klyro
            git pull --ff-only
            npm install --no-audit --no-fund
            VITE_API_URL=https://api.klyro.codes/api/v1 npm run build
            pm2 reload infra/ecosystem.config.cjs --update-env
            sleep 4
            bash infra/scripts/smoke-check.sh https://api.klyro.codes/api/v1 || (pm2 logs klyro-api --lines 40 --nostream; exit 1)
          '
